<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f5f4" />
    <meta name="description" content="Qinyi AI Support for custom puzzles, paper games and printed packaging enquiries." />
    <link rel="canonical" href="https://nininininini979-tech.github.io/qinyi-printing-website/ai-support.html" />
    <title>勤益智能客服 | Qinyi</title>
    <link rel="stylesheet" href="./assets/support.css" />
  </head>
  <body>
    <a class="skip-link" href="#messageInput" data-support-copy="skip">跳到消息输入框</a>

    <div class="app-shell">
      <header class="topbar">
        <a class="support-home-link" id="supportHomeLink" href="./" target="_top" aria-label="返回勤益网站" data-support-copy-aria="home">
        <div class="brand" aria-label="勤益智能客服" data-support-copy-aria="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <div class="brand-name" data-support-copy="brand">勤益智能客服</div>
            <div class="brand-status" id="headerStatus">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="headerStatusText" data-support-copy="connecting">正在连接服务</span>
            </div>
          </div>
          </div>
        </a>

        <button class="button button--secondary" id="newConversationButton" type="button">
          <span aria-hidden="true">＋</span>
          <span data-support-copy="newConversation">新对话</span>
        </button>
      </header>

      <main class="workspace">
        <aside class="support-sidebar" aria-label="客服服务信息" data-support-copy-aria="serviceInfo">
          <section class="sidebar-section" aria-labelledby="serviceStatusTitle">
            <div class="section-heading">
              <p class="eyebrow" data-support-copy="currentService">当前服务</p>
              <span class="status-badge" id="sidebarStatusBadge" data-support-copy="connectingShort">连接中</span>
            </div>
            <h2 id="serviceStatusTitle" data-support-copy="serviceName">勤益</h2>
            <p class="section-copy" id="serviceStatusDetail">
              <span data-support-copy="checkingService">正在确认知识库与会话服务状态。</span>
            </p>
            <dl class="service-meta">
              <div>
                <dt data-support-copy="session">会话</dt>
                <dd id="sessionState" data-support-copy="notStarted">尚未开始</dd>
              </div>
              <div>
                <dt data-support-copy="serviceMode">处理方式</dt>
                <dd id="serviceMode" data-support-copy="checkingShort">正在确认</dd>
              </div>
            </dl>
          </section>

          <section class="sidebar-section" aria-labelledby="serviceScopeTitle">
            <p class="eyebrow" data-support-copy="scope">服务范围</p>
            <h2 id="serviceScopeTitle" data-support-copy="canHelp">可以为您处理</h2>
            <ul class="scope-list">
              <li data-support-copy="scopeProducts">产品介绍与场景化选型方案</li>
              <li data-support-copy="scopeMaterials">尺寸、材质、工艺与包装建议</li>
              <li data-support-copy="scopeRfq">定制需求梳理与报价信息准备</li>
            </ul>
          </section>

          <section class="boundary-note" aria-labelledby="boundaryTitle">
            <h2 id="boundaryTitle" data-support-copy="manualHeading">需要人工处理</h2>
            <p data-support-copy="manualCopy">最终报价与折扣、固定交期、运费税费、订单变更、认证适用性及合同售后事项需要业务人员确认。</p>
          </section>
        </aside>

        <section class="chat-panel" aria-labelledby="conversationTitle">
          <header class="chat-header">
            <div>
              <p class="eyebrow" data-support-copy="onlineSupport">在线支持</p>
              <h1 id="conversationTitle" data-support-copy="conversationTitle">与客服对话</h1>
            </div>
            <div class="mobile-service-status" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="mobileStatusText" data-support-copy="connectingShort">连接中</span>
            </div>
          </header>

          <div
            class="messages"
            id="messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
            aria-label="对话记录"
            data-support-copy-aria="conversationLog"
          >
            <div class="empty-state" id="emptyState">
              <div class="empty-mark" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <h2 data-support-copy="welcomeTitle">您好，需要帮您处理什么？</h2>
              <p data-support-copy="welcomeDetail">您可以咨询定制拼图、卡牌、桌游及产品方案。</p>
              <div class="suggestions" aria-label="常见问题" data-support-copy-aria="suggestions">
                <button class="suggestion" type="button" data-question="1000片拼图有哪些现有模具尺寸？" data-support-question="questionSizes">
                  <span data-support-copy="suggestionSizes">拼图规格</span>
                  <strong data-support-copy="suggestionSizesDetail">1000片拼图有哪些尺寸？</strong>
                </button>
                <button class="suggestion" type="button" data-question="礼品拼图有哪些包装和材质方案？" data-support-question="questionPackaging">
                  <span data-support-copy="suggestionPackaging">材质与包装</span>
                  <strong data-support-copy="suggestionPackagingDetail">礼品拼图怎么选择包装？</strong>
                </button>
                <button class="suggestion" type="button" data-question="定制拼图的设计文件有什么要求？" data-support-question="questionFiles">
                  <span data-support-copy="suggestionFiles">印前文件</span>
                  <strong data-support-copy="suggestionFilesDetail">设计文件有什么要求？</strong>
                </button>
                <button class="suggestion" type="button" data-question="我想做500套适合15岁左右用户的礼品拼图，请帮我推荐产品方案。" data-support-question="questionPlan">
                  <span data-support-copy="suggestionPlan">方案推荐</span>
                  <strong data-support-copy="suggestionPlanDetail">帮我推荐一套礼品拼图方案</strong>
                </button>
              </div>
            </div>
          </div>

          <div class="error-banner" id="errorBanner" role="alert" hidden>
            <div>
              <strong id="errorTitle" data-support-copy="sendFailed">消息发送失败</strong>
              <p id="errorMessage" data-support-copy="retryLater">请稍后重试。</p>
            </div>
            <div class="error-actions">
              <button class="button button--small" id="retryButton" type="button" data-support-copy="retry">重试</button>
              <button class="icon-button" id="dismissErrorButton" type="button" aria-label="关闭错误提示" data-support-copy-aria="dismissError">
                ×
              </button>
            </div>
          </div>

          <footer class="composer-region">
            <div class="composer-options">
              <button
                class="mode-toggle"
                id="professionalConsultationButton"
                type="button"
                aria-pressed="false"
                title="切换专业咨询模式"
                data-support-copy-title="professionalTitle"
              >
                <span class="mode-toggle__indicator" aria-hidden="true"></span>
                <span data-support-copy="professional">专业咨询</span>
              </button>
            </div>
            <form class="composer" id="chatForm">
              <label class="sr-only" for="messageInput" data-support-copy="messageLabel">输入您的问题</label>
              <textarea
                id="messageInput"
                name="message"
                rows="1"
                maxlength="2000"
                placeholder="请输入您的问题"
                data-support-copy-placeholder="messagePlaceholder"
                autocomplete="off"
                enterkeyhint="send"
                required
              ></textarea>
              <button class="send-button" id="sendButton" type="submit" aria-label="发送消息" data-support-copy-aria="send" disabled>
                <span aria-hidden="true">↑</span>
              </button>
            </form>
            <p class="privacy-note" data-support-copy="privacy">请勿发送密码、验证码、银行卡号或机密生产文件。</p>
          </footer>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="./assets/support-config.js"></script>
    <script src="./assets/support-i18n.js" defer></script>
    <script src="./assets/support.js" defer></script>
  </body>
</html>
